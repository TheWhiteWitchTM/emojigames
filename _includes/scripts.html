<script>
document.querySelectorAll('.dropdown-toggle').forEach(btn => {
  btn.addEventListener('click', e => {
    e.preventDefault();
    btn.nextElementSibling.classList.toggle('open');
  });
});

document.addEventListener('DOMContentLoaded', () => {
  const game = document.getElementById('game');
  if (!game) return;

  // Prefer the actual terminal element
  const terminal = game.querySelector('#output') || game.querySelector('textarea') || game.querySelector('.terminal-wrap') || game;

  const btn = document.createElement('button');
  btn.id = 'fs-btn';
  btn.textContent = 'Fullscreen';
  btn.title = 'Enter fullscreen mode. Press Esc or click again to exit.';
  btn.style.cssText = `
    position: absolute;
    top: 4px;
    right: 4px;
    z-index: 30;
    background: rgba(10, 20, 10, 0.9);
    color: #39ff14;
    border: 1px solid #39ff14;
    border-radius: 3px;
    padding: 2px 8px;
    font-size: 12px;
    font-family: monospace;
    cursor: pointer;
    white-space: nowrap;
  `;

  // Make sure the terminal can contain the absolute button
  terminal.style.position = 'relative';
  terminal.parentElement.style.position = 'relative';
  terminal.parentElement.appendChild(btn);

  btn.addEventListener('click', e => {
    e.stopPropagation();
    if (!document.fullscreenElement) {
      game.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  });

  document.addEventListener('fullscreenchange', () => {
    if (document.fullscreenElement) {
      btn.textContent = 'Exit Fullscreen';
      btn.title = 'Exit fullscreen (Esc also works)';
    } else {
      btn.textContent = 'Fullscreen';
      btn.title = 'Enter fullscreen mode. Press Esc or click again to exit.';
    }
  });
});
</script>
