{% include gtag.html %}
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Emoji Games">
<link rel="icon" href="{{ '/assets/icons/favicon-32.png' | relative_url }}" type="image/png" sizes="32x32">
<link rel="icon" href="{{ '/assets/icons/icon-192.png' | relative_url }}" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}" sizes="180x180">
<link rel="manifest" href="{{ '/manifest.webmanifest' | relative_url }}">
{% include install-capture.html %}

<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">

<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:image" content="{{ page.image | default: site.image | absolute_url }}">
<meta property="og:image:alt" content="{{ page.title | default: site.title }}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@TheWhiteWitchTM">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:image" content="{{ page.image | default: site.image | absolute_url }}">
<meta name="twitter:image:alt" content="{{ page.title | default: site.title }}">
