title: Emoji Games
description: A White Witch spinoff. Emoji games, no accounts, no tracking.
url: "https://thewhitewitchtm.github.io"
baseurl: "/emojigames"
image: /assets/images/preview.jpg

collections_dir: collections

collections:
  games:
    output: true
    permalink: /games/:name/
  releases:
    output: true
    permalink: /releases/:path/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-responsive-image

responsive_image:
  template: _includes/responsive-image.html
  sizes:
    - width: 240
      height: 135
    - width: 480
      height: 270

feed:
  path: /feed.xml
  posts_limit: 20
  collections:
    - releases

defaults:
  - scope:
      path: ""
      type: "games"
    values:
      layout: "game"
  - scope:
      path: ""
      type: "releases"
    values:
      layout: "default"
