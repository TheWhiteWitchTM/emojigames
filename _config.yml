title: Emoji Games
description: Emoji Games by The White Witch. Old games drawn with emoji. Carriers, Galaxy Hunt, The Oregon Trail, Hack, Rogue, and the rest of the shelf. No accounts.
keywords: Emoji Games, The White Witch, Mira, emoji games, Carriers, Galaxy Hunt, Oregon Trail, Hack, Rogue, Pong, Snake, Elite, Witch Hunt, Pale March, retro games, browser games, MAGIC
url: "https://thewhitewitchtm.github.io"
baseurl: "/emojigames"
image: /assets/images/preview.jpg

collections_dir: collections

collections:
  games:
    output: true
    permalink: /games/:path/
  releases:
    output: true
    permalink: /releases/:path/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-responsive-image

responsive_image:
  template: _includes/responsive-image.html
  sizes:
    - width: 240
      height: 135
    - width: 480
      height: 270

feed:
  path: /feed.xml
  posts_limit: 20
  collections:
    - releases

defaults:
  - scope:
      path: ""
      type: "games"
    values:
      layout: "game"
  - scope:
      path: ""
      type: "releases"
    values:
      layout: "release"
